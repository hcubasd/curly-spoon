services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: curly
      POSTGRES_PASSWORD: spoon
      POSTGRES_DB: curly_spoon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curly -d curly_spoon"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://curly:spoon@postgres:5432/curly_spoon?sslmode=disable"
      - "up"
